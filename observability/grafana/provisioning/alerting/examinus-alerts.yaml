# Grafana unified alerting rules for Examinus. No contact points are provisioned: until one is set up in Grafana
# (Alerting > Contact points) the rules only show their state in the Alerting UI.
apiVersion: 1
groups:
  - orgId: 1
    name: examinus-api
    folder: Examinus
    interval: 1m
    rules:
      - uid: examinus-api-defects
        title: "API defects"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "At least one RPC ended in a defect (unexpected error) in the last 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(examinus_rpc_duration_ms_count{job="examinus-api", outcome="defect"}[5m])) or vector(0)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: examinus-api-p95
        title: "API p95 latency above 1 s"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "RPC p95 latency has been above 1000 ms for 10 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(examinus_rpc_duration_ms_bucket{job="examinus-api"}[5m])))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1000]
      - uid: examinus-save-answer-errors
        title: "attempt.saveAnswer error rate above 2%"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "More than 2% of attempt.saveAnswer calls failed over 5 minutes: students may be losing answers."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '100 * sum(rate(examinus_rpc_duration_ms_count{job="examinus-api", rpc="attempt.saveAnswer", outcome!="ok"}[5m])) / sum(rate(examinus_rpc_duration_ms_count{job="examinus-api", rpc="attempt.saveAnswer"}[5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
      - uid: examinus-runner-unreachable
        title: "Code runner unreachable"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The API could not reach the code runner in the last 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(examinus_runner_duration_ms_count{job="examinus-api", outcome="unreachable"}[5m])) or vector(0)'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
      - uid: examinus-event-loop-lag
        title: "Event-loop lag above 200 ms"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The API event loop has been lagging by more than 200 ms for 5 minutes."
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(examinus_event_loop_lag_ms_ratio{job="examinus-api"})'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [200]
