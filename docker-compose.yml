# Dragonfly (the API's cache and event channels) and the API image.
#   docker compose up dragonfly   # only Dragonfly, on 127.0.0.1:6379 (REDIS_URL=redis://127.0.0.1:6379)
#   docker compose up             # Dragonfly and the API (http://127.0.0.1:3001), configured by apps/rpc/.env
# The API still needs PostgreSQL (DATABASE_URL) and, for images, S3; inside the container 127.0.0.1 is the
# container itself, so point those at host.docker.internal or a hosted service.
services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    # Nothing in it has to survive a restart (counts, caches, channels), so no snapshots.
    command: ["dragonfly", "--dbfilename=", "--proactor_threads=2"]
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/rpc/Dockerfile
    env_file:
      - path: apps/rpc/.env
        required: false
    environment:
      REDIS_URL: redis://dragonfly:6379
      PORT: "3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      dragonfly:
        condition: service_healthy

  # Local Grafana, Prometheus, Tempo and Loki in one container (see README "Observability"):
  #   docker compose --profile observability up otel-lgtm
  # Not started by a plain `docker compose up`.
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3300:3000" # Grafana (3000 is the web app)
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    volumes:
      # Added beside the image's own provisioning files, so its prometheus, tempo and loki datasources stay.
      - ./observability/grafana/provisioning/dashboards/examinus-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/examinus-dashboards.yaml:ro
      - ./observability/grafana/provisioning/alerting/examinus-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/examinus-alerts.yaml:ro
      - ./observability/grafana/dashboards:/examinus/dashboards:ro
