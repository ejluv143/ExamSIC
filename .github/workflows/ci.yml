name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: examinus
          POSTGRES_PASSWORD: examinus
          POSTGRES_DB: examinus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examinus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
        ports:
          - 6379:6379
        options: >-
          --ulimit memlock=-1
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://examinus:examinus@localhost:5432/examinus
      REDIS_URL: redis://localhost:6379
      # Throwaway values: CI only needs them to be valid.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      # The key the integration tests attest the desktop app with (native-clients.integration.test.ts).
      DESKTOP_ATTEST_KEY: ci-only-desktop-attest-key
      BETTER_AUTH_URL: http://localhost:3000
      API_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Check migrations are consistent
        run: npm run db:check
      - name: Check the schema has no ungenerated changes
        run: |
          npm run db:generate -- --name ci-drift-check
          if [ -n "$(git status --porcelain -- apps/rpc/src/database/migrations)" ]; then
            git status --short -- apps/rpc/src/database/migrations
            echo "::error::The Drizzle schema changed without a migration. Run 'npm run db:generate -- --name <change>' and commit the result."
            exit 1
          fi
      - name: Apply migrations to a fresh database
        run: npm run db:migrate
      - name: Load the integration test fixture
        run: npm run test:fixture -w @examinus/rpc
      - name: Start the API and check it serves RPC
        run: |
          npm run start -w @examinus/rpc > api.log 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:3001/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:3001/rpc -H 'content-type: application/json' \
            -d '{"_tag":"Request","id":"1","tag":"auth.config","payload":null,"headers":[]}' | grep -q '"Success"' \
            || { cat api.log; exit 1; }
      - name: Check Google Classroom roster sync against a stand-in for Google
        run: npm run check:classroom
      - name: Integration tests (relay, sessions, attempts, game, quiz edits, bank, organizations)
        run: npm run test:integration -w @examinus/rpc || { cat api.log; exit 1; }

      - run: npm run build:web

  # The images CI doesn't otherwise touch (issue #44): a broken Dockerfile fails here instead of at deploy. Built only,
  # never pushed.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: API image (apps/rpc/Dockerfile)
        run: docker build -f apps/rpc/Dockerfile -t examinus-rpc:ci .
      - name: MCP server image (apps/mcp/Dockerfile)
        run: docker build -f apps/mcp/Dockerfile -t examinus-mcp:ci .
      - name: Code runner sandbox (apps/runner/sandbox)
        run: docker build -t examinus-sandbox:ci apps/runner/sandbox
