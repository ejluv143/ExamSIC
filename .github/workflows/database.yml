name: Database

# The production database is on Neon and the web app on Vercel. Two jobs:
#
# `rehearse` runs every pull request that touches the schema or migrations: it makes a Neon branch of production
# (a copy-on-write snapshot of the real data, `pr-<number>`), applies the pending migrations to it, and deletes the
# branch. A migration that works on CI's empty database but not on production's rows fails here, before merge.
#
# `migrate` runs after `CI` passes on `main`: it rehearses once more on a fresh branch of production, then migrates
# production itself (the `production` environment's DATABASE_URL: Neon's direct, non-pooled string), then asks
# Vercel to build and deploy the web app through a deploy hook, so the web app is never ahead of the database.
# One at a time, never cancelled.
#
# Setup: the Neon GitHub integration (or by hand) gives the repository variable NEON_PROJECT_ID and the secret
# NEON_API_KEY. The `production` environment needs the DATABASE_URL secret (and, optionally, required reviewers).
# VERCEL_DEPLOY_HOOK_URL (production environment secret) is a Vercel deploy hook for the production branch; turn off
# Vercel's own Git deploys for `main` so this workflow is the only thing that deploys. Without NEON_PROJECT_ID the
# rehearsals are skipped; without the hook, Vercel is left alone.

on:
  pull_request:
    paths:
      - "apps/rpc/src/database/**"
      - "apps/rpc/drizzle.config.ts"
      - ".github/workflows/database.yml"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  rehearse:
    if: github.event_name == 'pull_request' && vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: database-rehearse-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Branch production
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pr-${{ github.event.pull_request.number }}
          database: ${{ vars.NEON_DATABASE || 'neondb' }}
          role: ${{ vars.NEON_ROLE || 'neondb_owner' }}
      - name: Apply the pending migrations to the branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: npm run db:migrate
      - name: Delete the branch
        if: always() && steps.branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_id: ${{ steps.branch.outputs.branch_id }}

  migrate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: database-migrate
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Branch production
        id: branch
        if: vars.NEON_PROJECT_ID != ''
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: deploy-${{ github.event.workflow_run.head_sha }}
          database: ${{ vars.NEON_DATABASE || 'neondb' }}
          role: ${{ vars.NEON_ROLE || 'neondb_owner' }}
      - name: Rehearse on the branch
        if: steps.branch.outcome == 'success'
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: npm run db:migrate
      - name: Delete the branch
        if: always() && steps.branch.outcome == 'success'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_id: ${{ steps.branch.outputs.branch_id }}
      - name: Migrate production
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Give the production environment a DATABASE_URL secret (Neon's direct connection string)."; exit 1; }
          npm run db:migrate
      - name: Deploy the web app on Vercel
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          curl -sSf -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null
          echo "Asked Vercel to deploy ${{ github.event.workflow_run.head_sha }}."
