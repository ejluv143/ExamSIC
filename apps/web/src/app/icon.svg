<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0b1326" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060e20" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neonShieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#31394d" stroke-width="1.5" stroke-opacity="0.6"/>
  <ellipse cx="256" cy="235" rx="110" ry="100" fill="#6366f1" opacity="0.22" filter="url(#softGlow)"/>
  <ellipse cx="256" cy="235" rx="70" ry="60" fill="#38bdf8" opacity="0.18" filter="url(#softGlow)"/>
  <g filter="url(#dropShadow)">
    <path d="M 256,92 L 378,160 L 378,285 C 378,358 256,418 256,418 C 256,418 134,358 134,285 L 134,160 Z" fill="none" stroke="url(#accentCyan)" stroke-width="3" stroke-opacity="0.35" stroke-linejoin="round"/>
    <circle cx="256" cy="92" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle cx="378" cy="160" r="4" fill="#6366f1"/>
    <circle cx="134" cy="160" r="4" fill="#6366f1"/>
    <circle cx="256" cy="418" r="4.5" fill="#34d399"/>
    <polygon points="256,122 360,178 256,234 152,178" fill="url(#primaryGrad)" filter="url(#neonShieldGlow)"/>
    <polygon points="256,122 360,178 256,234 152,178" fill="url(#glassFacet)"/>
    <polygon points="256,162 274,178 256,194 238,178" fill="#ffffff" opacity="0.95" filter="url(#softGlow)"/>
    <path d="M 172,198 L 214,222 L 214,332 L 172,308 Z" fill="url(#primaryGrad)" opacity="0.95"/>
    <path d="M 172,198 L 214,222 L 214,332 L 172,308 Z" fill="url(#glassFacet)"/>
    <path d="M 230,248 L 332,248 L 316,276 L 230,276 Z" fill="url(#accentCyan)" filter="url(#softGlow)"/>
    <line x1="240" y1="262" x2="310" y2="262" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 172,328 L 256,375 L 344,326 L 344,354 L 256,403 L 172,356 Z" fill="url(#primaryGrad)"/>
    <path d="M 230,360 L 256,375 L 282,360 L 256,403 Z" fill="url(#accentEmerald)" opacity="0.9"/>
    <path d="M 360,178 C 368,214 366,242 376,268" fill="none" stroke="url(#accentCyan)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 5"/>
    <circle cx="376" cy="272" r="4.5" fill="#38bdf8" filter="url(#softGlow)"/>
  </g>
</svg>
