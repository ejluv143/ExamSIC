[package]
name = "examinus-desktop"
# Kept in step with ../package.json (the release workflow checks). Semantic versioning: see the README.
version = "0.1.0"
description = "Examinus Desktop: the student client for exams, a locked shell around the web app"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "examinus_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
